# Render Blueprint (legacy, single-service).
# Prefer using the repo-root `render.yaml` which deploys BOTH:
# - MEXC frontend (static)
# - tradebot (python worker)

services:
  - type: web
    name: sellbitweb-mexc
    runtime: static

    rootDir: .

    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    # SPA: все маршруты отдавать index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    autoDeployTrigger: commit
